services:
  mongo:
    image: mongo:7
    command: ["mongod", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["ellas_mongo:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  ellas_mongo:
